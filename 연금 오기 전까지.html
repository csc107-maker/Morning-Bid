<script type="application/json" class="daily-item">{"k":"news","id":"2026-10-29-fed","date":"2026-10-29","cat":"재테크","title":"미 연준, 기준금리 연 3.75~4.00% 동결…위원 2명은 인상 주장","summary":"미국 연방준비제도는 10월 28일(현지 기준) 기준금리를 연 3.75~4.00%로 유지했다. 표결은 10 대 2였고, 리사 쿡 이사와 베스 해맥 총재는 0.25%포인트 인상을 주장하며 반대했다. 지난달 금리를 올린 뒤 속도를 조절한 결정이며, 물가가 여전히 높다는 판단이어서 추가 긴축 여지가 남았다고 연합뉴스는 전했다.","source":{"name":"미국 연방준비제도 공식 발표","url":"https://federalreserve.gov/newsevents/pressreleases/monetary20261028a.htm","at":"2026-10-28"},"checked":[{"name":"중앙일보(코리아중앙데일리)","url":"https://www.koreadaily.com/article/20261028131547892"},{"name":"연합뉴스(한민족센터 전재)","url":"https://www.koreancenter.or.kr/news/articleView.html?idxno=1431303"}]}</script>
<script type="application/json" class="daily-item">{"k":"news","id":"2026-10-22-bok","date":"2026-10-22","cat":"재테크","title":"한국은행 기준금리 연 3.00% 동결…다음 결정은 11월 26일","summary":"한국은행 금융통화위원회는 10월 22일 기준금리를 연 3.00%로 유지했다. 위원 7명이 모두 찬성했고, 7·8월 연속 인상 뒤 처음 숨을 고른 결정이다. 한은은 물가와 경기, 금융안정을 점검해 추가 인상의 시기와 속도를 정하겠다는 입장이며, 올해 마지막 통화정책 회의는 11월 26일에 열린다.","source":{"name":"한국은행 통화정책방향 자료(KDI 게재)","url":"https://eiec.kdi.re.kr/policy/materialView.do?num=288401","at":"2026-10-22"},"checked":[{"name":"노컷뉴스","url":"https://nocutnews.co.kr/news/6595353"},{"name":"연합뉴스(한민족센터 전재)","url":"https://www.koreancenter.or.kr/news/articleView.html?idxno=1428068"}]}</script>
<script type="application/json" class="daily-item">{"k":"news","id":"2026-10-30-china-pv","date":"2026-10-30","cat":"태양광","title":"중국 1~9월 태양광 신규 설치 110.83GW, 1년 전보다 53.9% 감소","summary":"중국 국가에너지국 자료로, 올해 1~9월 신규 태양광 설치는 110.83GW로 지난해 같은 기간(240.27GW)보다 53.9% 줄었다. 다만 9월 설치량은 13.64GW로 8월(11.04GW)보다 23.6% 늘었다. 풍력과 태양광을 합친 누적 설비는 2TW를 넘어 전체 발전설비의 약 48.7%다. 이 자료만으로는 국내 모듈 가격에 미칠 영향은 알 수 없다.","source":{"name":"pv magazine Global","url":"https://www.pv-magazine.com/2026/10/27/chinas-solar-installations-fall-54-year-on-year-despite-september-rebound/","at":"2026-10-27"},"checked":[{"name":"energynews.pro","url":"https://energynews.pro/en/china-passes-a-symbolic-threshold-in-wind-and-solar-installed-capacity"}]}</script>
<script type="application/json" class="daily-item">{"k":"news","id":"2026-10-22-sunvillage","date":"2026-10-22","cat":"태양광","title":"송전망 주변 마을 태양광 지원안 입법예고…12월 1일까지","summary":"기후에너지환경부는 10월 22일부터 12월 1일까지 국가기간전력망 특별법 시행령 관련 고시와 입지선정위원회 운영기준 개정안을 입법예고했다. 송전선로가 지나는 지방정부 지원금(1km당 20억 원)의 3분의 2 이내를 주변 마을에 나누고, 마을이 태양광 사업을 하면 설치비를 먼저 반영하는 내용이다. 9월 발표 때 정부는 많게는 가구당 연 300만 원 수준을 기대한다고 밝혔으며, 확정된 금액은 아니다.","source":{"name":"기후에너지환경부 보도(정책브리핑 게재)","url":"https://www.korea.kr/news/policyNewsView.do?newsId=148974055","at":"2026-10-21"},"checked":[{"name":"KDI 경제교육·정보센터(기후부 자료)","url":"https://eiec.kdi.re.kr/policy/materialView.do?num=288369"},{"name":"뉴스서울(9월 15일 발표 보도)","url":"https://newsseoul.co.kr/news/view/1065606018438945"}]}</script>
<script type="application/json" class="daily-item">{"k":"column","id":"2026-11-02-column","date":"2026-11-02","series":"연금 오기 전까지","title":"수출은 사상 최대인데 코스피는 하루 3% 급락…뉴스는 이 순서로 읽으세요","paras":["지난 금요일(10월 30일) 코스피는 하루 만에 3.48% 내려 5,730.74에 마감했습니다. 그런데 이틀 뒤인 11월 1일, 정부는 10월 수출이 1,152억 8천만 달러로 1년 전보다 93.7% 늘었다고 발표했습니다. 같은 주에 '역대급 호황'과 '급락'이 함께 나온 셈입니다. 은퇴를 앞둔 분들은 이런 날 계좌 숫자를 몇 번씩 들여다보게 됩니다. 오늘은 이런 뉴스를 어떤 순서로 읽으면 마음이 덜 흔들리는지 정리해 봅니다.","첫째, 뉴스는 '오늘의 숫자'이고 내 생활비는 '앞으로 몇 년의 숫자'입니다. 수출 통계는 한 달 성적표이고, 지수 하락은 하루 성적표입니다. 그런데 연금 공백기에 필요한 돈은 매달 정해진 날 나갑니다. 그래서 가장 먼저 볼 것은 시장이 아니라 '연금이 나오기 전까지 매달 모자라는 돈이 얼마인가'입니다. 이 앱의 '연금 오기 전까지' 계산에서 월 부족액과 부족한 개월 수를 먼저 확인해 보세요.","둘째, 같은 뉴스 안에도 뒷면이 있습니다. 한국경제 보도에 따르면 이번 수출에서 반도체 비중은 약 49%였고, 반도체를 뺀 품목의 증가율은 34%였습니다. 좋은 숫자이지만 한 품목에 크게 기댄 구조라는 지적이 함께 나옵니다. 그리고 30일 지수 하락도 삼성전자·SK하이닉스 같은 반도체 대형주가 이끌었다고 전해졌습니다. 같은 업종 이름이 '호재'와 '하락' 기사에 모두 나온 것입니다. 다만 이 연결은 제가 읽은 방식일 뿐, 주가가 움직인 원인을 하나로 단정할 수는 없습니다.","셋째, 금리 뉴스는 대출과 예금에 바로 닿습니다. 미국 연준은 10월 28일 기준금리를 연 3.75~4.00%로 유지했고, 위원 2명은 0.25%포인트 인상을 주장했습니다. 한국은행도 10월 22일 연 3.00%로 동결했지만, 올해 마지막 회의가 11월 26일에 열리고 추가 인상 여부에 관심이 쏠린다는 보도가 나옵니다. 변동금리 대출이 있다면 만기와 금리 방식을 거래 은행에 한 번 확인해 두시는 것이 좋습니다.","마지막으로, 퇴직연금과 IRP를 언제 어떤 방식으로 꺼낼지는 가입한 상품과 세금에 따라 사람마다 달라서 이 글로 정해 드릴 수 없습니다. 인출 시기와 세금은 가입한 금융회사나 국세청에 물어보시고, 국민연금 수령액과 노후 준비는 국민연금공단 상담에서 확인하세요. 이 글은 특정 상품이나 종목을 권하지 않습니다. 오늘 해 볼 일은 하나입니다. 앱의 계산 결과에서 월 부족액을 종이에 적어 두세요. 숫자가 있으면 다음 뉴스를 만났을 때 비교할 기준이 생깁니다."],"refs":[{"name":"헤럴드경제 · 10월 수출 보도","url":"https://biz.heraldcorp.com/article/10921621"},{"name":"아시아경제 · 10월 30일 코스피 마감","url":"https://view.asiae.co.kr/article/2026103016084854064"},{"name":"미국 연준 FOMC 성명(10월 28일)","url":"https://federalreserve.gov/newsevents/pressreleases/monetary20261028a.htm"},{"name":"한국은행 통화정책방향(10월 22일)","url":"https://eiec.kdi.re.kr/policy/materialView.do?num=288401"},{"name":"국민연금공단","url":"https://www.nps.or.kr"}]}</script>

  var NOT_ACCEPTED = ['대출·투자 권유·가상자산', '의약품, 의료행위, 질병 치료 효과를 내세우는 건강기능식품', '홍보관·방문판매·다단계', '확정 수익, 원금·손실 보장 등을 내세우는 표현'];

  function roomOf(id) { for (var i = 0; i < ROOMS.length; i++) if (ROOMS[i].id === id) return ROOMS[i]; return null; }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function todayStr(d) { d = d || new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function isDate(s) { return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(new Date(s + 'T00:00:00').getTime()); }
  function isSafeUrl(u) { return typeof u === 'string' && /^https:\/\/[^\s"'<>]+$/.test(u) && u.length <= 300; }
  function screenText(t) {
    var s = String(t || ''), hit = [];
    BANNED.forEach(function (b) { if (s.indexOf(b) >= 0) hit.push(b); });
    return hit;
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function validateAd(ad) {
    var errors = [];
    if (!ad || typeof ad !== 'object') return { ok: false, errors: ['광고 형식이 올바르지 않습니다'] };
    ['id', 'room', 'sponsor', 'title', 'body', 'cta', 'url', 'start', 'end'].forEach(function (k) { if (!ad[k] || !String(ad[k]).trim()) errors.push(k + ' 누락'); });
    if (ad.room && !roomOf(ad.room)) errors.push('알 수 없는 방');
    ['sponsor', 'title', 'body', 'cta'].forEach(function (k) { if (ad[k] && String(ad[k]).length > LIMITS[k]) errors.push(k + ' ' + LIMITS[k] + '자 초과'); });
    if (ad.url && !isSafeUrl(ad.url)) errors.push('링크는 https 주소여야 합니다');
    if (ad.start && !isDate(ad.start)) errors.push('시작일 형식(YYYY-MM-DD)');
    if (ad.end && !isDate(ad.end)) errors.push('종료일 형식(YYYY-MM-DD)');
    if (isDate(ad.start) && isDate(ad.end) && ad.end < ad.start) errors.push('종료일이 시작일보다 빠름');
    if (ad.room === 'insurance' && !(ad.reviewNo && String(ad.reviewNo).trim())) errors.push('보험 광고는 심의·확인번호가 필요합니다');
    var banned = screenText([ad.title, ad.body, ad.sponsor, ad.cta].join(' '));
    if (banned.length) errors.push('게재할 수 없는 표현: ' + banned.join(', '));
    return { ok: errors.length === 0, errors: errors };
  }

  // 방에 보일 광고: 검증 통과 + 게재 기간 안 + 방당 최대 개수
  function visibleAds(roomId, today, list) {
    today = today || todayStr(); list = list || ADS;
    return list.filter(function (a) { return a && a.room === roomId && validateAd(a).ok && a.start <= today && today <= a.end; })
      .sort(function (x, y) { return x.start < y.start ? -1 : (x.start > y.start ? 1 : 0); }).slice(0, LIMITS.perRoom);
  }

  // 문의처 표시용: 이메일은 mailto, 전화번호는 tel(누르면 전화), https 주소는 링크, 그 밖은 글자로만 보여 줍니다
  function contactInfo(c) {
    c = String(c == null ? '' : c).trim();
    if (!c) return null;
    if (/^[^\s@<>"'()]+@[^\s@<>"'()]+\.[^\s@<>"'()]+$/.test(c)) return { kind: 'email', text: c, href: 'mailto:' + c };
    if (/^0\d{1,2}-\d{3,4}-\d{4}$/.test(c)) return { kind: 'tel', text: c, href: 'tel:' + c.replace(/-/g, '') };
    if (isSafeUrl(c)) return { kind: 'url', text: c, href: c };
    return { kind: 'text', text: c, href: '' };
  }

  // 운영자 화면용: 광고가 지금 어떤 상태인지
  function statusOf(ad, today, list) {
    today = today || todayStr(); list = list || ADS;
    var v = validateAd(ad);
    if (!v.ok) return { code: 'error', label: '고쳐야 함', errors: v.errors };
    if (today < ad.start) return { code: 'scheduled', label: '게재 예정' };
    if (today > ad.end) return { code: 'expired', label: '기간 지남' };
    var ids = visibleAds(ad.room, today, list).map(function (a) { return a.id; });

  function chartSVG(R) {

    rows.forEach(function (r) { var t = r.nps + r.per + r.ret + r.sav + r.work + r.short; if (t > yMax) yMax = t; });
    yMax *= 1.06;
    var innerW = W - padL - padR, n = rows.length, step = innerW / n, bw = Math.max(4, step * 0.78);
    function Y(v) { return padT + (H - padT - padB) * (1 - v / yMax); }

    var startX = null;
    rows.forEach(function (r, i) {
      var x = padL + i * step + (step - bw) / 2, base = 0;

        if (p[1] > 0.0001) { var y1 = Y(base + p[1]), y0 = Y(base); svg += '<rect class="seg-' + p[0] + '" x="' + x.toFixed(1) + '" y="' + y1.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(0.5, y0 - y1).toFixed(1) + '"/>'; base += p[1]; }
      });
      if (r.short > 0.0001) { var ys1 = Y(base + r.short), ys0 = Y(base); svg += '<rect x="' + x.toFixed(1) + '" y="' + ys1.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(0.5, ys0 - ys1).toFixed(1) + '" fill="url(#hatch1)" style="stroke:var(--short)" stroke-width="0.8"/>'; }

    svg += '<text class="chart-t strong" x="' + padL + '" y="14">┄ 한 달 생활비 ' + manDec(need) + '</text>';

      svg += '<text class="chart-t strong" x="' + tx.toFixed(1) + '" y="34" text-anchor="' + anchor + '" style="fill:var(--brand)">국민연금 ' + c.start + '세</text>';
    }
