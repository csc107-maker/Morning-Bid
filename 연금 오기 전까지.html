          '<div style="margin-top:22px"><span class="flabel">모아둔 돈 중 비상금으로 남겨 둘 비율</span>' + chips('spend', 'reservePct', [0, 10, 20, 30], function (v) { return v + '%'; }) +

  var FLOWS = { main: STEPS, job: JSTEPS, spend: SSTEPS };

  /* ---------- 힌트 ---------- */
  function spendSum() { var t = 0; SP.CATS.forEach(function (c) { t += Number(state.spend[c.k]) || 0; }); return t; }
  var HINTS = {
    birth: function () { var by = state.inp.birthYear, P = E.npsStartAge(by), age = THIS_YEAR - by; return '국민연금은 <b>만 ' + P + '세</b>부터 받습니다. 올해 약 <b>' + age + '세</b>입니다.<br><span class="muted">1957~1976년생 기준으로 만든 계산기입니다.</span>'; },
    retire: function () {
      var age = THIS_YEAR - state.inp.birthYear, r = state.inp.retireAge;
      return r < age ? '이미 그만두셨다면 지금 나이(<b>' + age + '세</b>)부터 계산합니다.' : '주된 일자리를 그만두는 평균 나이는 52.9세라는 통계가 있습니다. (국민연금공단 중앙노후준비지원센터 자료 인용 보도)';
    },
    nps: function () { var P = E.npsStartAge(state.inp.birthYear); return state.inp.npsUnknown ? '모르셔도 계산은 됩니다. 이 경우 국민연금 0원으로 계산하니, 확인하신 뒤 다시 넣어 주세요.' : '만 ' + P + '세에 정해진 대로 받을 때의 금액을 넣어 주세요. 일찍·늦게 받을 때의 금액은 제가 계산합니다.'; },
    fund: function () {
      var i = state.inp, gapStart = Math.max(i.retireAge, THIS_YEAR - i.birthYear), st = Math.max(E.MIN_FUND_AGE, gapStart), mo = i.retireYears > 0 ? i.retireFund / (i.retireYears * 12) : 0;
      return '연금으로 받는 것은 만 55세부터 가능하다고 보고 계산합니다. <b>' + st + '세</b>부터 <b>' + i.retireYears + '년</b> 동안 한 달 <b>' + manDec(mo) + '</b>씩 받는 것으로 봅니다. 세금은 빼지 않았습니다.';
    },
    personal: function () { var i = state.inp; return !i.personalMonthly ? '개인연금이 없으면 이대로 다음으로 가세요.' : '<b>' + Math.max(55, i.personalStartAge) + '세</b>부터 한 달 <b>' + manDec(i.personalMonthly) + '</b>을 받는 것으로 계산합니다. (55세 이전에는 받을 수 없다고 봅니다)'; },
    savings: function () { return '지금 계획으로는 모아둔 돈 <b>' + man(state.inp.savings) + '</b>을 모자란 달부터 차례로 꺼내 씁니다.'; },
    jobhours: function () { var h = state.job.hours; return '주 <b>' + h + '시간</b>을 최저임금(시급 ' + comma(E.MIN_WAGE) + '원)으로 일하면 세전 월 약 <b>' + manDec(E.monthlyFromHourly(E.MIN_WAGE, h)) + '</b>입니다. 실제 시급은 일마다 다릅니다.'; },

      if (h.energy === 'often') out.push('혼자 견디지 마세요. 정신건강위기상담전화 1577-0199(24시간)로 전화하실 수 있습니다.');

    sptotal: function () { return '지금까지 입력한 한 달 지출 합계: <b>' + manDec(spendSum()) + '</b>'; }

  function refreshHints() { var els = document.querySelectorAll('[data-hint]'); for (var i = 0; i < els.length; i++) { var f = HINTS[els[i].getAttribute('data-hint')]; if (f) els[i].innerHTML = f(); } }

  /* ---------- 소개 ---------- */
  function ruler() {
    var W = 340, x0 = 12, x1 = 328, a0 = 50, a1 = 75;
    function X(a) { return x0 + (a - a0) / (a1 - a0) * (x1 - x0); }
    var retire = 53, pension = 65, ticks = '', labels = '';
    for (var a = a0; a <= a1; a++) { var big = a % 5 === 0; ticks += '<line x1="' + X(a) + '" y1="72" x2="' + X(a) + '" y2="' + (big ? 84 : 78) + '" stroke="var(--muted)" stroke-width="' + (big ? 2 : 1) + '"/>'; if (big) labels += '<text class="chart-t strong" x="' + X(a) + '" y="102" text-anchor="middle">' + a + '</text>'; }
    return '<svg viewBox="0 0 ' + W + ' 128" role="img" aria-label="나이 눈금자. 53세에 일을 그만두고 65세에 국민연금을 받으면 그 사이 12년이 소득 공백입니다.">' +

      '<rect x="' + X(retire) + '" y="46" width="' + (X(pension) - X(retire)) + '" height="22" rx="4" fill="url(#hatch0)" style="stroke:var(--short)" stroke-width="1.5"/>' +
      '<text class="chart-t strong" x="' + ((X(retire) + X(pension)) / 2) + '" y="62" text-anchor="middle" style="paint-order:stroke;stroke:var(--surface);stroke-width:4px">소득 공백</text>' +
      '<line x1="' + X(retire) + '" y1="26" x2="' + X(retire) + '" y2="72" style="stroke:var(--ink)" stroke-width="2"/>' +
      '<text class="chart-t strong" x="' + (X(retire) - 2) + '" y="20" text-anchor="start">일을 그만둠</text>' +
      '<line x1="' + X(pension) + '" y1="26" x2="' + X(pension) + '" y2="72" style="stroke:var(--brand)" stroke-width="2.6"/>' +
      '<text class="chart-t strong" x="' + (X(pension) + 2) + '" y="20" text-anchor="end" style="fill:var(--brand)">국민연금 시작</text>' +
      '<line x1="' + x0 + '" y1="72" x2="' + x1 + '" y2="72" style="stroke:var(--muted)" stroke-width="2"/>' + ticks + labels +
      '<circle cx="' + X(55) + '" cy="72" r="5" style="fill:var(--c-ret)"/>' +

  }
  function introHTML() {

      '<p class="fine">입력하신 내용은 이 화면 안에서만 계산하며, 따로 보내거나 모으지 않습니다. 저장을 누르면 이 기기에만 남습니다. 모든 금액은 오늘 가치로 계산한 참고용 숫자이며, 금융상품을 권하는 서비스가 아닙니다. 광고방에는 광고가 실리며, 광고에는 「광고」라고 표시합니다. 커뮤니티방은 다른 서비스로 연결하는 곳입니다.</p>' + ownerLink() + '</section>';

  /* ---------- 질문 화면 ---------- */
  function stepHTML() {
    var steps = FLOWS[state.flow], st = steps[state.stepIndex], n = steps.length, last = state.stepIndex === n - 1;
    var nextLabel = last ? (state.flow === 'job' ? '추천 보기' : (state.flow === 'spend' ? '점검 결과 보기' : '결과 보기')) : '다음';
    return '<section>' + (FLOWNAME[state.flow] ? '<p class="eyebrow">' + FLOWNAME[state.flow] + '</p>' : '') +
      '<div class="progress"><span>' + (state.stepIndex + 1) + ' / ' + n + '</span><div class="bar" aria-hidden="true"><i style="width:' + ((state.stepIndex + 1) / n * 100) + '%"></i></div></div>' +
      '<h2 class="q" id="qtitle" tabindex="-1">' + st.title + '</h2><p class="help">' + st.help + '</p>' +
      '<div class="panel">' + st.body() + '</div>' +

    var pu, pa;
    try { pu = window.claude.use('user'); pa = window.claude.use('artifact'); } catch (e) { return; }
    Promise.all([pu, pa]).then(function (r) {
      var u = r[0], a = r[1];
      if (!u || typeof u.isOwner !== 'function' || !a || typeof a.publish !== 'function') return;
      return Promise.resolve(u.isOwner()).then(function (ok) {
        if (!ok) return;
        state.owner = true; state.artifactApi = a;
        if (!applyStash() && (state.view === 'intro' || state.view === 'adinfo')) render();
      });
    }).catch(function () {});
  }

  function adminAct(act, b) {
    if (act.indexOf('admin') !== 0) return false;
    if (!state.owner) return true;
    var pwOnly = /^admin-(open|unlock|setpw|showpw)$/.test(act);
    if (!pwOnly && !isUnlocked()) { state.view = 'admin'; render(); return true; }   // 잠겨 있으면(시간이 지났거나 잠근 뒤) 어떤 관리 동작도 하지 않고 비밀번호 화면으로
    var id = b.getAttribute('data-id');
    switch (act) {
      case 'admin-open': state.view = 'admin'; state.adminMsg = null; state.adminErr = []; render(); break;
      case 'admin-tab': var tb = b.getAttribute('data-tab'); state.adminTab = (tb === 'posts' || tb === 'links' || tb === 'pw') ? tb : 'ads'; state.adminErr = []; state.preview = null; state.confirmDel = ''; render(); break;
      case 'admin-ad-save': saveAd(); break;
      case 'admin-ad-preview': previewAd(); break;
      case 'admin-ad-cancel': state.adForm = blankAd(); state.adEditId = ''; state.adminErr = []; state.preview = null; render(); break;
      case 'admin-ad-edit':
        state.site.ads.forEach(function (a) { if (a.id === id) { state.adForm = Object.assign(blankAd(), a, { reviewNo: a.reviewNo || '' }); state.adEditId = a.id; } });
        state.adminErr = []; state.preview = null; renderKeep('admin-form-title'); break;
      case 'admin-ad-del':
        if (state.confirmDel === id) { removeById(state.site.ads, id); state.confirmDel = ''; if (state.adEditId === id) { state.adEditId = ''; state.adForm = blankAd(); } state.adminMsg = { type: 'info', text: '광고를 목록에서 뺐습니다. 게시하기를 눌러야 방문자 화면에서 사라집니다.' }; }
        else state.confirmDel = id;
        render(); break;
      case 'admin-post-save': savePost(); break;
      case 'admin-post-cancel': state.postForm = blankPost(); state.postEditId = ''; state.adminErr = []; render(); break;
      case 'admin-post-edit':
        state.site.posts.forEach(function (p) { if (p.id === id) { state.postForm = { title: p.title, body: p.body }; state.postEditId = p.id; } });
        state.adminErr = []; renderKeep('admin-form-title'); break;
      case 'admin-post-del':
        if (state.confirmDel === id) { removeById(state.site.posts, id); state.confirmDel = ''; if (state.postEditId === id) { state.postEditId = ''; state.postForm = blankPost(); } state.adminMsg = { type: 'info', text: '공지를 목록에서 뺐습니다. 게시하기를 눌러야 방문자 화면에서 사라집니다.' }; }
        else state.confirmDel = id;
        render(); break;
      case 'admin-cancel-del': state.confirmDel = ''; render(); break;
      case 'admin-discard': var base = JSON.parse(state.siteBase); state.site = { ads: base.ads, posts: base.posts, community: base.community, admin: base.admin }; state.linkForm = Object.assign({}, base.community); state.adForm = blankAd(); state.postForm = blankPost(); state.adEditId = ''; state.postEditId = ''; state.adminErr = []; state.preview = null; state.confirmDel = ''; state.adminMsg = { type: 'info', text: '담아 둔 변경을 모두 취소했습니다.' }; render(); break;
      case 'admin-link-save': saveLinks(); break;
      case 'admin-unlock': doUnlock(); break;
      case 'admin-setpw': doSetPw(); break;
      case 'admin-changepw': doChangePw(); break;
      case 'admin-lock': clearUnlock(); state.view = 'intro'; state.adminMsg = null; state.adminErr = []; state.lockMsg = null; render(); break;
      case 'admin-showpw':
        var pwEls = document.querySelectorAll('input[data-pw]'), showIt = pwEls.length > 0 && pwEls[0].type === 'password';
        for (var pi = 0; pi < pwEls.length; pi++) pwEls[pi].type = showIt ? 'text' : 'password';
        b.textContent = showIt ? '비밀번호 가리기' : '비밀번호 보이기'; break;
      case 'admin-publish': publishSite(); break;
    }
    return true;
  }


  /* ---------- 그리기 ---------- */
  function render() {
    var app = $('app');
    if (state.view === 'intro') app.innerHTML = introHTML();
    else if (state.view === 'step') app.innerHTML = stepHTML();
    else if (state.view === 'jobres') { state.healthDone = true; app.innerHTML = jobResultHTML(); }
    else if (state.view === 'spendres') app.innerHTML = spendResultHTML();
    else if (state.view === 'rooms') app.innerHTML = roomsHTML();
    else if (state.view === 'room') app.innerHTML = roomHTML();
    else if (state.view === 'adinfo') app.innerHTML = adinfoHTML();
    else if (state.view === 'community') app.innerHTML = communityHTML();
    else if (state.view === 'admin') app.innerHTML = state.owner ? (isUnlocked() ? adminHTML() : lockHTML()) : introHTML();
    else { app.innerHTML = resultHTML(); paintResult(); }
    refreshHints();
    try { window.scrollTo(0, 0); } catch (e) {}
    var t = $('qtitle'); if (t) { try { t.focus({ preventScroll: true }); } catch (e) {} }
  }
  function commitField(el) {
    var scope = el.getAttribute('data-scope') || 'main', key = el.getAttribute('data-key'), n = parseNum(el.value);
    if (n === null) n = DEF[scope][key];
    n = clamp(scope, key, n); store(scope)[key] = n; el.value = comma(n);
    if (scope === 'main' && key === 'npsMonthly') state.inp.npsUnknown = false;
    refreshHints();
  }
  function commitAll() { var els = document.querySelectorAll('input[data-key]'); for (var i = 0; i < els.length; i++) commitField(els[i]); }
  function startFlow(flow, step) { state.flow = flow; state.stepIndex = step || 0; state.view = 'step'; render(); }

  /* ---------- 이벤트 ---------- */
  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.matches && t.matches('input[data-key]')) {
      var scope = t.getAttribute('data-scope') || 'main', key = t.getAttribute('data-key'), n = parseNum(t.value);
      if (n !== null) { store(scope)[key] = n; if (scope === 'main' && key === 'npsMonthly') state.inp.npsUnknown = false; }
      refreshHints();
    } else if (t.id === 'work-slider') { state.inp.workMonthly = Number(t.value); paintResult(); }
    else if (t.getAttribute && t.getAttribute('data-form')) { adminField(t); }
  });
  document.addEventListener('change', function (e) { var t = e.target; if (t.matches && t.matches('input[data-key]')) commitField(t); else if (t.getAttribute && t.getAttribute('data-form')) adminField(t); });

  document.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button') : null;
    if (!b) return;
    var act = b.getAttribute('data-act'), scope = b.getAttribute('data-scope') || 'main';
    if (b.hasAttribute('data-chip')) {
      var k = b.getAttribute('data-chip'); store(scope)[k] = Number(b.getAttribute('data-val'));
      if (scope === 'main' && k === 'npsMonthly') state.inp.npsUnknown = false;
      render(); return;
    }
    if (b.hasAttribute('data-opt')) {
      var ok = b.getAttribute('data-opt'), ov = b.getAttribute('data-val'), y = window.scrollY;
      if (ok === 'scenario') state.scenario = ov; else store(scope)[ok] = ov;
      render(); if (ok === 'scenario' || state.view === 'step') { try { window.scrollTo(0, ok === 'scenario' ? y : y); } catch (e2) {} }
      return;
    }
    if (!act) return;
    if (act === 'dec' || act === 'inc') {
      var key = b.getAttribute('data-key'), L = lim(scope, key), el = $('f-' + scope + '-' + key);
      var cur = parseNum(el.value); if (cur === null) cur = DEF[scope][key];
      el.value = comma(clamp(scope, key, cur + (act === 'inc' ? 1 : -1) * L[2])); commitField(el); return;
    }
    if (adminAct(act, b)) return;
    switch (act) {
      case 'start': state.inp.workMonthly = 0; startFlow('main', 0); break;
      case 'sample': state.inp = Object.assign({}, SAMPLE_MAIN); state.scenario = 'normal'; state.view = 'result'; render(); break;
      case 'load': var sv = loadSaved(); if (sv && sv.inp) { state.inp = Object.assign({}, DEF.main, sv.inp); state.job = Object.assign({}, DEF.job, sv.job || {}); state.spend = Object.assign({}, DEF.spend, sv.spend || {}); state.scenario = sv.scenario || 'normal'; state.healthDone = !!sv.healthDone; state.view = 'result'; render(); } break;
      case 'next': commitAll(); if (state.stepIndex >= FLOWS[state.flow].length - 1) { state.view = AFTER[state.flow]; } else state.stepIndex++; render(); break;
      case 'prev': commitAll(); if (state.stepIndex <= 0) state.view = FLOWBACK[state.flow]; else state.stepIndex--; render(); break;
      case 'goto': startFlow(b.getAttribute('data-flow') || 'main', Number(b.getAttribute('data-step'))); break;
      case 'job-start': startFlow('job', 0); break;
      case 'spend-start': startFlow('spend', 0); break;
      case 'spend-sample': Object.assign(state.spend, SAMPLE_SPEND); render(); break;
      case 'back-result': state.view = 'result'; render(); break;
      case 'apply-work': state.inp.workMonthly = Number(b.getAttribute('data-val')); state.view = 'result'; render(); toast('일해서 월 ' + state.inp.workMonthly + '만 원을 번다고 보고 다시 계산했습니다.'); break;
      case 'nps-unknown': state.inp.npsMonthly = 0; state.inp.npsUnknown = true; render(); break;
      case 'fill-work':
        var R = compute(), z = zeroWork(R); state.inp.workMonthly = Math.min(400, Math.ceil(z.avgGapShort / 10) * 10);
        var sl = $('work-slider'); if (sl) sl.value = state.inp.workMonthly; paintResult(); break;
      case 'save': doSave(); break;
      case 'copy':
        var txt = summaryText(), done = function () { toast('복사했습니다. 메시지에 붙여 넣으세요.'); };
        var fallback = function () { $('r-copy').innerHTML = '<label class="sr" for="copybox">결과 요약</label><textarea id="copybox" class="copybox" readonly></textarea>'; var ta = $('copybox'); ta.value = txt; ta.focus(); ta.select(); toast('아래 글을 길게 눌러 복사하세요.'); };
        try { if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, fallback); else fallback(); } catch (err) { fallback(); }
        break;
      case 'rooms': state.roomsFrom = b.getAttribute('data-from') || state.roomsFrom; state.view = 'rooms'; render(); break;
      case 'room': state.room = b.getAttribute('data-room') || 'travel'; state.view = 'room'; render(); break;
      case 'adinfo': state.view = 'adinfo'; render(); break;
      case 'community': state.commFrom = b.getAttribute('data-from') || state.commFrom; state.view = 'community'; render(); break;
      case 'restart': state.view = 'intro'; render(); break;
    }
  });

  /* ---------- 시작 ---------- */
  if (window.claude && window.claude.hot && window.claude.hot.snapshot) {
    window.claude.hot.snapshot(function () { return { view: state.view, room: state.room, roomsFrom: state.roomsFrom, commFrom: state.commFrom, flow: state.flow, stepIndex: state.stepIndex, inp: state.inp, job: state.job, spend: state.spend, scenario: state.scenario, healthDone: state.healthDone }; });
  }
  function boot(d) {
    loadSite();
    if (d && d.inp) { state.inp = Object.assign({}, DEF.main, d.inp); state.job = Object.assign({}, DEF.job, d.job || {}); state.spend = Object.assign({}, DEF.spend, d.spend || {}); state.view = d.view || 'intro'; state.room = d.room || 'travel'; state.roomsFrom = d.roomsFrom || 'intro'; state.commFrom = d.commFrom || 'intro'; state.flow = d.flow || 'main'; state.stepIndex = d.stepIndex || 0; state.scenario = d.scenario || 'normal'; state.healthDone = !!d.healthDone; }
    render();
    detectOwner();
  }
  if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot);
  else boot((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();

</script>
</body>
</html>
